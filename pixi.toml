[workspace]
name = "ml-env-204"
platforms = ["linux-64"]
channels = [
  "nvidia/label/cuda-11.8.0",
  "nvidia",
  "conda-forge",
  "pytorch",
]

[dependencies]
python = "3.12.*"

# Force the CUDA runtime version line
cuda = { version = "*", channel = "nvidia/label/cuda-11.8.0" }

# Force torch stack from pytorch channel
pytorch = { version = "*", channel = "pytorch" }
torchvision = { version = "*", channel = "pytorch" }
pytorch-cuda = { version = "11.8.*", channel = "pytorch" }

# Scientific Python stack
matplotlib = "*"
pillow = "*"
numpy = "*"
tqdm = "*"
scikit-learn = "*"
transformers = "*"

# Jupyter
jupyterlab = "*"
jupytext = "*"

# NLP / retrieval stack
nltk = "*"
langchain = "*"
langchain-community = "*"
langchain-ollama = "*"
langgraph = "*"

# Lab4 (game server + runner + student task)
fastapi = "*"
uvicorn = "*"
sqlalchemy = ">=2.0"
pydantic = "*"
requests = "*"
httpx = "*"
loguru = "*"

[pypi-dependencies]
sqlite-vec = "*"
